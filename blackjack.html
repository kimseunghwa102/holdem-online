<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>GYBM 블랙잭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@1,800&display=swap">
<style>
/* Layout: a five-seat 3D blackjack table under one warm spotlight, an AI robot dealer behind the rack.
   The camera sits behind your seat; a slim HUD rides the top edge and the betting / action dock is pinned to the bottom. */
:root{
  --night:#06080c; --glass-2:rgba(255,255,255,.07);
  --ink:#f3efe6; --muted:#aab6b9; --dim:rgba(243,239,230,.56); --line:rgba(255,255,255,.13);
  --gold:#e6b65c; --gold-hi:#f8d68e; --gold-lo:#b8842a; --gold-ink:#241604;
  --cyan:#62e3f2; --cyan-ink:#03242b; --good:#5fd38d; --danger:#ec6a55;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-num:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 12%,#1d1b17 0%,#0b0c0f 55%,var(--night) 100%);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.4;touch-action:manipulation;-webkit-user-select:none;user-select:none;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(6,8,12,.86),rgba(6,8,12,0));pointer-events:none}
.hud>*{pointer-events:auto}
.brand{min-width:0;text-align:left;padding:2px 0}
.brand b{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;line-height:1;color:var(--gold);white-space:nowrap}
.brand b em{font-family:var(--f-num);font-style:normal;font-weight:500;font-size:10px;letter-spacing:.16em;color:var(--cyan-ink);background:var(--cyan);border-radius:5px;padding:2px 5px 1px}
.brand b svg{width:14px;height:14px;fill:none;stroke:var(--dim);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;margin-top:5px;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.bank{display:flex;flex-direction:column;align-items:flex-end;margin-right:4px}
.bank em{font-style:normal;font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-family:var(--f-num);white-space:nowrap}
.bank b{font-family:var(--f-num);font-weight:600;font-size:20px;line-height:1;color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off{color:var(--dim)}
.conn{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;max-width:calc(100% - 32px);padding:8px 14px;border-radius:999px;
  background:rgba(236,106,85,.16);box-shadow:inset 0 0 0 1px rgba(236,106,85,.5);font-size:12.5px;text-align:center;color:#ffd3c9}

/* ---------- floating labels over the 3D scene ---------- */
.tags{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.tags>*{position:absolute;left:0;top:0;will-change:transform}
.tag{padding:3px 10px;border-radius:999px;white-space:nowrap;
  font-family:var(--f-num);font-weight:500;font-size:14px;letter-spacing:.04em;background:rgba(5,8,12,.78);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 16px rgba(0,0,0,.4)}
.tag.sm{font-size:12px;padding:2px 8px}
.tag.active{box-shadow:0 0 0 1.5px var(--cyan),0 0 18px rgba(98,227,242,.45)}
.tag.bj{background:var(--gold);color:var(--gold-ink);font-weight:600}
.tag.bust,.tag.lose{background:#3b1714;color:#ffb3a6}
.tag.win{background:#123826;color:#9ff0c0}
.tag.push{background:#20262e;color:var(--muted)}
.tag small{font-family:var(--f-body);font-size:11px;letter-spacing:0;margin-left:6px;opacity:.8}
.stag{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 10px 6px;border-radius:12px;min-width:60px;white-space:nowrap;
  background:rgba(5,8,12,.8);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.45);transition:opacity .25s}
.stag b{font-size:12.5px;font-weight:700;line-height:1.3;max-width:7.5em;overflow:hidden;text-overflow:ellipsis}
.stag span{font-family:var(--f-num);font-size:12.5px;line-height:1.25;color:var(--gold);letter-spacing:.03em}
.stag em{font-style:normal;font-size:10.5px;line-height:1.3;color:var(--muted)}
.stag em.ok{color:var(--good)}
.stag.me{box-shadow:0 0 0 1.5px var(--gold),0 6px 16px rgba(0,0,0,.45)}
.stag.turn{box-shadow:0 0 0 1.5px var(--cyan),0 0 18px rgba(98,227,242,.5)}
.stag.off{opacity:.55}
.stag .tb{position:absolute;left:9px;right:9px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.stag .tb i{display:block;height:100%;width:100%;background:var(--cyan);transform-origin:left center}
.sit{pointer-events:auto;height:34px;padding:0 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--gold-hi);white-space:nowrap;
  background:rgba(20,16,8,.72);box-shadow:inset 0 0 0 1.5px rgba(230,182,92,.75),0 6px 16px rgba(0,0,0,.4)}
.sit:active{background:rgba(230,182,92,.3)}
.bubble{max-width:min(80vw,340px);padding:9px 14px 10px;border-radius:16px;
  background:rgba(240,251,253,.96);color:#06222a;font-size:14px;font-weight:500;line-height:1.45;text-align:center;text-wrap:balance;
  box-shadow:0 0 0 1.5px rgba(98,227,242,.9),0 14px 30px rgba(0,0,0,.45);transition:opacity .25s}
.bubble::before{content:"";position:absolute;left:var(--tail,50%);top:-7px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:inherit;box-shadow:-1.5px -1.5px 0 rgba(98,227,242,.9)}
.bubble i{display:block;font-style:normal;font-family:var(--f-num);font-size:10.5px;letter-spacing:.2em;color:#178a9a;margin-bottom:2px}
.bubble.hide{opacity:0}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding-top:30px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(0deg,rgba(6,8,12,.92) 34%,rgba(6,8,12,0));pointer-events:none}
.dock>div{pointer-events:auto;width:min(100%,560px);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.betbox{display:flex;flex-direction:column;gap:10px}
.chip{--c:#c4262f;--s:#f6f1e6;position:relative;width:52px;height:52px;border-radius:50%;flex:none;
  background:radial-gradient(closest-side,var(--c) 0 56%,rgba(255,255,255,.92) 57% 61%,var(--c) 62% 74%,transparent 75%),repeating-conic-gradient(var(--c) 0 20deg,var(--s) 20deg 40deg);
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.35);
  font-family:var(--f-num);font-weight:600;font-size:15px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .12s}
.chip:active{transform:translateY(3px)}
.chip:disabled{filter:grayscale(.85) brightness(.6)}
.chip.c5{--c:#c4262f;--s:#f6f1e6}.chip.c25{--c:#1d8c4e;--s:#f6f1e6}.chip.c100{--c:#26262c;--s:#f6f1e6}.chip.c500{--c:#6e2fa8;--s:#f3d37a}
.ghost{height:46px;padding:0 14px;border-radius:12px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:13.5px;white-space:nowrap;flex:none}
.ghost:disabled{opacity:.4}
.gold{flex:1;min-width:0;height:54px;border-radius:15px;font-weight:700;font-size:17px;color:var(--gold-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #6f4a14,0 10px 24px rgba(0,0,0,.45)}
.gold small{font-family:var(--f-num);font-weight:500;font-size:15px;margin-left:6px}
.gold:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #6f4a14}
.gold:disabled{opacity:.45}
.gold.ready{background:linear-gradient(180deg,#2f3a2f,#1d261e);color:#bff3d2;box-shadow:inset 0 0 0 1.5px rgba(95,211,141,.75),0 4px 0 rgba(0,0,0,.5)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{height:58px;border-radius:15px;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  background:linear-gradient(180deg,#2a313b,#171c23);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 4px 0 rgba(0,0,0,.5);color:var(--ink);transition:box-shadow .2s}
.act small{font-family:var(--f-num);font-weight:500;font-size:11.5px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.act.hit{background:linear-gradient(180deg,#25a067,#137046)}
.act.stand{background:linear-gradient(180deg,#3d2a27,#241614);box-shadow:inset 0 0 0 1px rgba(236,106,85,.55),0 4px 0 rgba(0,0,0,.5)}
.act.dbl{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--gold-ink)}
.act.dbl small{color:rgba(36,22,4,.7)}
.act:active{transform:translateY(2px)}
.act:disabled{opacity:.3}
.act.rec{box-shadow:0 0 0 2.5px var(--cyan),0 0 22px rgba(98,227,242,.6),0 4px 0 rgba(0,0,0,.5)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);min-height:20px}
.status b{font-family:var(--f-num);font-weight:500;color:var(--ink);letter-spacing:.03em}
.status .t{font-family:var(--f-num);color:var(--gold);letter-spacing:.04em}
.status.center{justify-content:center;text-align:center}
.wait{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.wait .t{font-family:var(--f-num);color:var(--gold);letter-spacing:.04em;white-space:nowrap}
.wait small{display:block;font-size:12px;color:var(--muted)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--cyan);transform-origin:left center}
.hint{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--cyan-ink);flex:none;
  background:linear-gradient(180deg,#a8f1fa,#46c6d8);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.hint svg{width:15px;height:15px;fill:currentColor}
.result{text-align:center;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:26px;line-height:1.1}
.result small{display:block;font-family:var(--f-body);font-style:normal;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.result.pos{color:var(--good)}.result.neg{color:var(--danger)}.result.even{color:var(--muted)}
.rules{text-align:center;font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.recover{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(236,106,85,.12);box-shadow:inset 0 0 0 1px rgba(236,106,85,.45)}
.recover div{flex:1;min-width:0}
.recover b{display:block;font-family:var(--f-display);font-style:italic;font-size:19px}
.recover span{font-size:12.5px;color:var(--muted)}
.recover .gold{flex:none;height:44px;padding:0 14px;font-size:14px}
.lform{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;padding:14px;border-radius:18px;
  background:rgba(8,11,15,.94);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 40px rgba(0,0,0,.5)}
.lform .lt{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center}
.lform .lt b{color:var(--ink)}
.lform input{height:48px;background:rgba(255,255,255,.07)}
.lform .pin{letter-spacing:.5em;text-align:center;font-family:var(--f-num)}
.lform .lerr{grid-column:1/-1}
.lform .lbtns{grid-column:1/-1}
.lerr{min-height:1.2em;font-size:12.5px;color:#ffb3a6;text-align:center}
@media (min-width:700px){
  .lform{grid-template-columns:minmax(0,1fr) 112px auto auto;align-items:center}
  .lform .lbtns{grid-column:auto;display:contents}
  .lform .lbtns .gold{flex:none;height:48px;padding:0 22px}
  .lform .lbtns .ghost{height:48px;order:1}
  .lform .lerr{order:2;min-height:0}
}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(4,6,9,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{width:min(100%,420px);max-height:100%;overflow:auto;padding:20px;border-radius:20px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,#141b22,#0c1015);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6)}
.sheet h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:26px;color:var(--gold)}
.sheet h3{margin:4px 0 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);font-weight:500}
.sheet p{margin:0;font-size:14px;line-height:1.55}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;text-align:left;min-height:96px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.gcard b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:19px;color:var(--gold);display:flex;align-items:center;gap:6px}
.gcard b em{font-family:var(--f-num);font-style:normal;font-weight:500;font-size:9.5px;letter-spacing:.14em;color:var(--cyan-ink);background:var(--cyan);border-radius:4px;padding:2px 4px 1px}
.gcard span{font-size:12px;color:var(--muted);line-height:1.45}
.gcard.on{box-shadow:inset 0 0 0 1.5px var(--cyan);background:rgba(98,227,242,.08)}
.gcard.on span::after{content:"지금 여기";display:block;color:var(--cyan)}
.sbtn{min-height:44px;padding:10px;border-radius:12px;font-weight:600;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sbtn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);box-shadow:none}
.sbtn.dng{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(236,106,85,.6);background:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{font-size:12.5px;line-height:1.6;color:var(--muted);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.notice b{color:var(--ink)}
.top5{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.top5 li{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 2px;border-top:1px solid var(--line)}
.top5 li:first-child{border-top:0}
.top5 i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--f-num);background:rgba(255,255,255,.1);flex:none}
.top5 li:nth-child(1) i{background:linear-gradient(180deg,#ffe9a8,#c9963c);color:#241604}
.top5 li:nth-child(2) i{background:linear-gradient(180deg,#f1f4f7,#9aa6b1);color:#151a1f}
.top5 li:nth-child(3) i{background:linear-gradient(180deg,#f2c39a,#a8673a);color:#241306}
.top5 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5 b{font-family:var(--f-num);font-weight:500;color:var(--gold);letter-spacing:.03em}
.top5 li.me span{color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:999px;background:var(--ink);color:#11161b;font-size:13px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:24px;background:var(--night);transition:opacity .5s}
.boot b{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:34px;color:var(--gold)}
.boot span{display:block;margin-top:10px;color:var(--muted);font-size:13.5px}
.boot.done{opacity:0;pointer-events:none}
@media (max-width:430px){
  .brand b{font-size:20px;gap:5px}
  .brand b em{font-size:9px;padding:2px 4px 1px}
  .brand small{font-size:11px}
  #voiceBtn{display:none}
  .hright{gap:5px}
  .bank{margin-right:2px}
}
@media (min-width:760px) and (min-aspect-ratio:1/1){
  .brand b{font-size:26px}
  .act{height:62px;font-size:17px}
}
@media (max-height:520px){
  .hud{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:4px}
  .brand small{display:none}
  .dock{padding-top:18px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .dock>div{gap:7px;width:min(100%,620px)}
  .chip{width:42px;height:42px;font-size:13px}
  .gold{height:44px;font-size:15px}
  .ghost{height:40px}
  .act{height:46px;font-size:15px}
  .act small{display:none}
  .rules{display:none}
  .result{font-size:21px}
  .wait{min-height:44px;padding:7px 14px}
  .betbox{flex-direction:row;align-items:center}
  .betbox .chips{flex:none;gap:8px}
  .betbox .row{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-label="블랙잭 테이블 3D 화면"></canvas>
<div class="tags" id="tags">
  <div class="bubble hide" id="bubble"><i>AI DEALER</i><span id="bubbleText"></span></div>
</div>
<header class="hud" id="hud">
  <button class="brand" id="brandBtn" type="button" aria-label="게임 선택 열기"><b>Blackjack<em>BETA</em><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></b><small id="meta">GYBM · 6덱 · 블랙잭 3:2</small></button>
  <div class="hright">
    <div class="bank" id="bankBox" hidden><em id="rankTxt">CHIPS</em><b id="bank">0</b></div>

  err.textContent = '';
  const r = await call('login', { name, pin });
  if (!r.ok) { if ($('liErr')) $('liErr').textContent = r.msg || '들어가지 못했어요.'; return; }
  lsSet('token', r.token); lsSet('name', r.name); myToken = r.token; kicked = null;
  greeted = true;
  say(r.isNew ? `${r.name}님, 처음 오셨네요! 칩 ${fmt(r.chips)}개로 시작해요.` : `${r.name}님, 다시 오셨네요. 빈 자리에 앉아 주세요.`, 'happy', { voice: true });
});
$('brandBtn').addEventListener('click', () => { $('menuSheet').hidden = false; renderMenu(); });
$('menuBtn').addEventListener('click', () => { $('menuSheet').hidden = false; renderMenu(); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => ($(b.dataset.close).hidden = true)));
$('menuSheet').addEventListener('click', e => { if (e.target === $('menuSheet')) $('menuSheet').hidden = true; const g = e.target.closest('[data-go]'); if (g && g.dataset.go === 'holdem') { $('menuSheet').hidden = true; goHoldem(); } });
$('leaveBtn').addEventListener('click', async () => { $('menuSheet').hidden = true; const r = await simple('bj:leave'); if (r.ok && r.pending) toast('이번 판이 끝나면 자리에서 일어나요.'); });
function toggleSound() { SND.on = !SND.on; lsSet('sound', SND.on ? '1' : '0'); if (SND.on) SND.play('chip'); renderUI(); }
function toggleVoice() { VOICE.on = !VOICE.on; lsSet('voice', VOICE.on ? '1' : '0'); if (VOICE.on) { VOICE.prime(); VOICE.say('음성 안내를 켰어요.'); } else try { speechSynthesis.cancel(); } catch {} renderUI(); }
$('soundBtn').addEventListener('click', toggleSound); $('soundToggle').addEventListener('click', toggleSound);
$('voiceBtn').addEventListener('click', toggleVoice); $('voiceToggle').addEventListener('click', toggleVoice);
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|BUTTON/.test((e.target && e.target.tagName) || '')) return;
  const k = e.key.toLowerCase(), v = V; if (!v || !v.me) return;
  if (v.opts) { const m = { h: 'hit', s: 'stand', d: 'double', p: 'split' }[k]; if (m) { e.preventDefault(); act(m); } else if (k === 'i') hint(); }
  else if ((k === 'enter' || k === ' ') && v.me.seat != null && ['idle', 'betting', 'over'].includes(v.phase)) {
    e.preventDefault(); const st = v.seats[v.me.seat];
    if (st && st.bet && !st.ready) simple('bj:ready', { on: true }); else if (st && !st.bet && v.me.lastBet) simple('bj:rebet');
  }
});

/* ---------- camera: behind your seat, or the whole table when watching ----------
   Watching: from behind the middle seat, high enough to take in all five circles.
   Seated: orbit round to your seat (all the way on a phone) and aim between your cards and the dealer's. */
const CAM = {
  over: { tall: { fov: 58, h: 27, d: 13.5, t: 2.6 }, wide: { fov: 40, h: 14.5, d: 13.2, t: 2.3 } },
  seat: { tall: { fov: 50, h: 13.6, d: 9.2, w: .58, kc: 1 }, wide: { fov: 40, h: 14.4, d: 12.6, w: .44, kc: .5 } },
};
const camState = { pos: new THREE.Vector3(), tgt: new THREE.Vector3(), fov: 50, init: false };
// a short landscape phone leaves little room between the HUD and the dock: come in closer
const SHORT = { near: .72, w: .36, t: 3.7 };
function camPose(s, k) {
  const pr = (m, key) => lerp(CAM[m].tall[key], CAM[m].wide[key], k), short = innerHeight < 520;
  const near = short ? SHORT.near : 1;
  if (s == null) {
    const tgt = new THREE.Vector3(0, 0, ZE + (short ? SHORT.t : pr('over', 't')));
    return { tgt, pos: tgt.clone().add(new THREE.Vector3(0, pr('over', 'h') * near, pr('over', 'd') * near)), fov: pr('over', 'fov') };
  }
  const phi = (Math.PI / 2 - TH[s]) * pr('seat', 'kc');
  const tgt = new THREE.Vector3(0, 0, DEALER_Z).lerp(at(s, RC), short ? SHORT.w : pr('seat', 'w'));
  const pos = tgt.clone().add(new THREE.Vector3(Math.sin(phi) * pr('seat', 'd') * near, pr('seat', 'h') * near, Math.cos(phi) * pr('seat', 'd') * near));
  return { tgt, pos, fov: pr('seat', 'fov') };
}
function placeCamera(dt) {
  const k = clamp((innerWidth / innerHeight - .5) / (1.5 - .5), 0, 1), goal = camPose(mySeat(), k);
  const e = camState.init ? 1 - Math.exp(-dt * 2.6) : 1; camState.init = true;
  camState.pos.lerp(goal.pos, e); camState.tgt.lerp(goal.tgt, e); camState.fov = lerp(camState.fov, goal.fov, e);
  camera.fov = camState.fov; camera.position.copy(camState.pos); camTarget.copy(camState.tgt);
  camera.lookAt(camTarget); camera.updateProjectionMatrix();
}
function frame() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', frame);

/* ---------- loop ---------- */
let last = performance.now(), lastUi = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (document.visibilityState !== 'visible') { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  stepTweens(now); robot.update(now / 1000, dt); placeCamera(dt); placeGlow(now / 1000); tickBank(dt);
  renderer.render(scene, camera); placeTags(now);
  if (now - lastUi > 200) { lastUi = now; tickTimers(); }
}

/* ---------- boot ---------- */
(async () => {
  try { await Promise.race([Promise.all(['600 56px Oswald', 'italic 800 60px "Playfair Display"', '700 16px "IBM Plex Sans KR"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch {}
  BACK_MAT = new THREE.MeshStandardMaterial({ map: texOf(backCanvas()), roughness: .5 });
  buildTable(); buildRack(); buildShoe(); setShoe(1);
  frame(); placeCamera(0); requestAnimationFrame(loop);
  sceneReady = true; renderUI(); runSync();
  setTimeout(() => $('boot').classList.add('done'), 150);
  setTimeout(greet, 900);
  window.__bj = { get V() { return V; }, D, busy: () => syncing || tweens.size > 0, camera, CAM, SHORT, camState, frame, pt: (x, y, z) => toScreen(new THREE.Vector3(x, y, z)), seatPt: (s, r = RC) => toScreen(at(s, r)), chin: () => toScreen(robot.chin()),
    probe: (seat) => { const s = seat != null ? seat : (mySeat() != null ? mySeat() : 2), q = v => { const o = toScreen(v); return [Math.round(o.x), Math.round(o.y)]; };
      return { head: q(new THREE.Vector3(0, 3.9, ZE - 1.45)), dealer: q(new THREE.Vector3(0, 0, DEALER_Z)), cards: q(at(s, RC)), bet: q(at(s, RB)), tag: q(tagSpot(s)), rail: q(at(s, R + .9)),
        s0: q(at(0, RB)), s4: q(at(4, RB)), cardW: Math.round(toScreen(at(s, RC, .5)).x - toScreen(at(s, RC, -.5)).x), dock: Math.round($('dock').getBoundingClientRect().top) }; } };
})();
})();
</script>
