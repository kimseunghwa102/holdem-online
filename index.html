<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15100c">
<title>GYBM 홀덤 테이블</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first card room — oval felt with 5 seats rotated so YOU sit at the bottom, hand + action rail under it */
:root{
  --rail:#15100c; --rail-2:#231a14; --rail-3:#2e2219;
  --felt:#0f4a3f; --felt-deep:#082b25; --felt-line:rgba(230,214,170,.16);
  --ink:#f0ede3; --muted:#a6bdb4; --faint:rgba(240,237,227,.14);
  --brass:#d8ad55; --brass-ink:#1d1406;
  --card:#f8f3e8; --card-ink:#1a1c1e; --red:#c2372b; --back:#7b2b22; --back-2:#933a2e;
  --win:#f2d27a; --danger:#d9705e; --good:#7fcf9c; --on:#5fd18a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--rail);background-image:radial-gradient(120% 70% at 50% 0%,var(--rail-3),var(--rail) 70%);color:var(--ink);font-family:var(--f-body);font-size:14px;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--win);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1.05;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted);text-transform:none}
.hbtns{display:flex;gap:6px}
.ghost{border:1px solid rgba(240,237,227,.25);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.ghost:hover{border-color:var(--brass);color:var(--brass)}
.notice{font-size:12.5px;line-height:1.45;color:var(--muted);background:rgba(240,237,227,.06);border-radius:10px;padding:8px 12px}
.notice b{color:var(--ink)}
.notice.bad{color:var(--danger)}

/* login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:.05em;line-height:1}
.login p{margin:0;color:var(--muted);line-height:1.55}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input{font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid rgba(240,237,227,.18);border-radius:10px;padding:12px;min-width:0;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.pin{letter-spacing:.5em;text-align:center;font-family:var(--f-mono)}
.err{color:var(--danger);font-size:13px;min-height:1.2em}

/* table */
.tbl{position:relative;width:100%;aspect-ratio:10/11;max-height:58vh;margin-inline:auto}
.felt{position:absolute;inset:8% 11% 9%;border-radius:999px;background:radial-gradient(80% 60% at 50% 45%,var(--felt),var(--felt-deep));
  box-shadow:inset 0 0 0 6px #3a2618,inset 0 0 0 7px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.4)}
.felt::after{content:"";position:absolute;inset:16px;border:1px solid var(--felt-line);border-radius:999px}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.pot{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1;min-height:1em}
.pot small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em;margin-right:5px}
.board{display:flex;gap:4px;--cw:min(10.4vw,46px)}
.street{font-size:10.5px;letter-spacing:.16em;color:var(--muted);min-height:1.2em}
.seat{position:absolute;transform:translate(-50%,-50%);width:30%;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.p0{left:50%;top:88%}.p1{left:15.5%;top:63%}.p2{left:19%;top:17%}.p3{left:81%;top:17%}.p4{left:84.5%;top:63%}
.mini{display:flex;gap:2px;--cw:20px}
.mini.show{--cw:27px}
.plate{width:100%;box-sizing:border-box;background:rgba(18,13,10,.88);border-radius:12px;padding:5px 8px 6px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(240,237,227,.08);transition:box-shadow .2s,opacity .2s}
.nm{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;min-width:0}
.nm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:rgba(240,237,227,.25)}
.dot.on{background:var(--on)}
.dbtn{flex:none;width:16px;height:16px;border-radius:50%;background:var(--card);color:var(--card-ink);font:800 10px/16px var(--f-display);text-align:center}
.ch{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{font-size:11.5px;min-height:1.3em;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brass);display:flex;align-items:center;gap:4px;white-space:nowrap}
.st .chip{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,var(--brass) 35%,#7a5a1d 36% 48%,var(--brass) 49%);flex:none}
.st.muted{color:var(--muted);font-family:var(--f-body)}
.st.win{color:var(--win);font-weight:600}
.st.hand{color:var(--ink);font-family:var(--f-body)}
.seat.turn .plate{box-shadow:0 0 0 2px var(--brass),0 0 18px rgba(216,173,85,.35)}
.seat.folded .plate,.seat.out .plate,.seat.away .plate{opacity:.5}
.seat.winner .plate{box-shadow:0 0 0 2px var(--win),0 0 22px rgba(242,210,122,.4)}
.empty{width:66px;height:66px;border-radius:50%;border:1.5px dashed rgba(240,237,227,.28);font-size:12px;color:var(--muted);display:grid;place-items:center;background:rgba(10,8,6,.35)}
.empty:not(:disabled){border-style:solid;border-color:rgba(216,173,85,.6);color:var(--ink)}
.empty:not(:disabled):hover{border-color:var(--brass);color:var(--brass)}
.ticker{font-size:12px;color:var(--muted);text-align:center;min-height:1.4em;line-height:1.4}
.ticker span:last-child{color:var(--ink)}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--card-ink);position:relative;flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.4),0 5px 12px rgba(0,0,0,.25);font-family:var(--f-display);transition:opacity .2s,transform .2s}
.card .r{position:absolute;top:5%;left:9%;font-weight:800;font-size:calc(var(--cw)*.4);line-height:1;letter-spacing:-.03em}
.card .s{position:absolute;bottom:5%;right:8%;font-size:calc(var(--cw)*.46);line-height:1;font-family:var(--f-body)}
.card.red{color:var(--red)}
.card.back{background:repeating-linear-gradient(45deg,var(--back) 0 4px,var(--back-2) 4px 8px);box-shadow:inset 0 0 0 2px var(--card),0 2px 0 rgba(0,0,0,.4)}
.card.slot{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(240,237,227,.14)}
.card.dim{opacity:.32}
.card.hi{transform:translateY(-3px);box-shadow:0 0 0 2px var(--win),0 6px 14px rgba(0,0,0,.35)}

/* my hand */
.mine{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px;background:rgba(240,237,227,.05)}
.mine .cards{display:flex;gap:6px;--cw:min(16vw,62px)}
.mine .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mine .made{font-weight:600;font-size:15px}
.mine .sub{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--danger)}
.seatBtns{display:flex;flex-wrap:wrap;gap:6px}
.seatBtns button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid rgba(240,237,227,.22);color:var(--muted)}
.seatBtns button:hover{color:var(--ink);border-color:rgba(240,237,227,.5)}

/* actions */
.bar{display:flex;flex-direction:column;gap:8px}
.raiseRow{display:flex;align-items:center;gap:10px}
.raiseRow input[type=range]{flex:1;min-width:0;accent-color:var(--brass);padding:0;background:none;border:0}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;min-width:5ch;text-align:right}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{padding:8px 0;border-radius:8px;background:rgba(240,237,227,.07);font-size:12px;color:var(--muted)}
.presets button:hover{color:var(--ink);background:rgba(240,237,227,.13)}
.acts{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:8px}
.acts button,.wide{padding:14px 6px;border-radius:12px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.fold{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(240,237,227,.28)}
.fold:hover{box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.call{background:#245c50}.call:hover{background:#2c6e60}
.raise{background:var(--brass);color:var(--brass-ink)}
.raise:hover:not(:disabled){filter:brightness(1.07)}
.raise:disabled,.wide:disabled{opacity:.35}
.wide{width:100%;background:var(--brass);color:var(--brass-ink)}
.wait{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:12px 14px;border-radius:12px;background:rgba(240,237,227,.05)}
.wait .tm{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.result{text-align:center;font-size:14px;line-height:1.5;color:var(--muted)}
.result b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.03em;color:var(--win);font-weight:800}
.recover{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:rgba(217,112,94,.12);box-shadow:inset 0 0 0 1px rgba(217,112,94,.5);text-align:center}
.recover b{font-family:var(--f-display);font-size:22px;letter-spacing:.03em}

/* sheets */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,8,6,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--rail-2);border-radius:18px;padding:20px;width:min(100%,440px);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em}
.sheet h3{margin:6px 0 0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.sheet input{padding:9px 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button,.sheet .sbtn{padding:11px;border-radius:10px;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(240,237,227,.28)}
.sbtn.pri{background:var(--brass);color:var(--brass-ink);box-shadow:none}
.sbtn.dng{box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.msg{font-size:12.5px;min-height:1.2em;color:var(--good)}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank th{font-weight:400;font-size:11px;color:var(--muted);text-align:right;padding:4px;letter-spacing:.04em}
.rank td{padding:8px 4px;border-top:1px solid var(--faint);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rank th:nth-child(2),.rank td:nth-child(2){text-align:left}
.rank td:nth-child(2){font-family:var(--f-body);max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank td:first-child{color:var(--muted);width:2em;text-align:left}
.rank tr.me td{color:var(--brass)}
.rank .medal{font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--win)}
.wrapx{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--rail);font-size:13px;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="notice bad" id="conn" hidden>서버에 연결하는 중이에요… 무료 서버는 깨어나는 데 1분쯤 걸릴 수 있어요.</div>

  <!-- login -->
  <section class="login" id="login" hidden>
    <div>
      <h1>GYBM<br>홀덤 테이블</h1>
    </div>
    <p>닉네임과 PIN 4자리로 입장해요. 처음이면 새 계정이 만들어지고, 다음엔 같은 닉네임 + PIN으로 들어오면 저장된 칩으로 이어서 해요.</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <label class="field">닉네임 (1~10자)<input id="liName" maxlength="10" autocomplete="username" placeholder="예: 승화"></label>
      <label class="field">PIN (숫자 4자리)<input id="liPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder="••••"></label>
      <div class="err" id="liErr"></div>
      <button type="submit" class="wide" id="liBtn">입장하기</button>
    </form>
  </section>

  <!-- game -->
  <section id="game" hidden style="display:flex;flex-direction:column;gap:10px">
    <header>
      <div class="brand">GYBM 홀덤 테이블<small id="meta"></small></div>
      <div class="hbtns"><button class="ghost" id="rankBtn" type="button">랭킹</button><button class="ghost" id="menuBtn" type="button">메뉴</button></div>
    </header>
    <div class="tbl">
      <div class="felt"></div>
      <div class="center"><div class="pot" id="pot"></div><div class="board" id="board"></div><div class="street" id="street"></div></div>
      <div id="seats"></div>
    </div>
    <div class="ticker" id="ticker"></div>
    <section class="mine" id="mine"></section>
    <section class="bar" id="bar"></section>
  </section>
</div>

<div class="overlay" id="rankSheet" hidden>
  <div class="sheet">
    <h2>랭킹</h2>
    <div class="wrapx"><table class="rank" id="rankTable"></table></div>
    <div class="notice">칩이 많은 순서예요. 손익은 지금 칩에서 받은 칩(시작 + 복구)을 뺀 값이에요.</div>
    <button type="button" class="sbtn" data-close="rankSheet">닫기</button>
  </div>
</div>

<div class="overlay" id="menuSheet" hidden>
  <div class="sheet">
    <h2>메뉴</h2>
    <div class="notice" id="menuInfo"></div>
    <button type="button" class="sbtn" id="adminOpen">방장 설정</button>
    <button type="button" class="sbtn dng" id="logoutBtn">로그아웃 (이 기기에서)</button>
    <button type="button" class="sbtn" data-close="menuSheet">닫기</button>
  </div>
</div>

<div class="overlay" id="adminSheet" hidden>
  <div class="sheet">
    <h2>방장 설정</h2>
    <label class="field" id="adKeyWrap">관리자 키<input id="adKey" type="password" autocomplete="off" placeholder="서버에 설정한 ADMIN_KEY"></label>
    <div class="msg" id="adMsg"></div>
    <div id="adBody" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="notice" id="adOwner"></div>
      <h3>테이블 설정</h3>
      <div class="grid3">
        <label class="field">시작 칩<input id="cfgStart" type="number" inputmode="numeric"></label>
        <label class="field">SB<input id="cfgSb" type="number" inputmode="numeric"></label>
        <label class="field">BB<input id="cfgBb" type="number" inputmode="numeric"></label>
      </div>
      <div class="grid2">
        <label class="field">파산 복구 %<input id="cfgRec" type="number" inputmode="numeric"></label>
        <label class="field">차례 제한(초)<input id="cfgTurn" type="number" inputmode="numeric"></label>
      </div>
      <button type="button" class="sbtn pri" id="cfgSave">설정 저장</button>
      <h3>플레이어 관리</h3>
      <label class="field">닉네임<input id="tgName" list="tgList" maxlength="10" autocomplete="off"></label>
      <datalist id="tgList"></datalist>
      <div class="grid2">
        <label class="field">칩 수정<input id="tgChips" type="number" inputmode="numeric" placeholder="예: 1000"></label>
        <label class="field">새 PIN<input id="tgPin" type="password" inputmode="numeric" maxlength="4" placeholder="4자리"></label>
      </div>
      <div class="grid2">
        <button type="button" class="sbtn" id="tgSetChips">칩 적용</button>
        <button type="button" class="sbtn" id="tgSetPin">PIN 변경</button>
      </div>
      <button type="button" class="sbtn" id="tgSetAdmin">이 사람에게 방장 넘기기</button>
      <button type="button" class="sbtn dng" id="tgDelete">이 계정 삭제</button>
      <button type="button" class="sbtn dng" id="resetAll">전체 칩 초기화</button>
    </div>
    <button type="button" class="sbtn" data-close="adminSheet">닫기</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const SI = [0,1,2,3,4];
const SUIT = {s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
const STREETS = ['프리플랍','플랍','턴','리버'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString();
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} }

let V = null, recvAt = 0, connected = false, resuming = !!lsGet('holdem.token'), lastTurn = '';
let adminKey = '';
const ui = { raiseTo: 0, raiseKey: '', barSig: '', resetArm: 0 };

let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); }

const sock = io({ reconnectionDelay: 800, reconnectionDelayMax: 5000 });
function call(ev, msg){ return new Promise(res => { if (!sock.connected) return res({ ok:false, msg:'서버에 연결되지 않았어요.' }); sock.timeout(8000).emit(ev, msg || {}, (err, r) => res(err ? { ok:false, msg:'응답이 없어요. 다시 시도해주세요.' } : r)); }); }

sock.on('connect', async () => {
  connected = true;
  const token = lsGet('holdem.token');
  if (token) {
    resuming = true; show();
    const r = await call('resume', { token });
    resuming = false;
    if (!r.ok) lsSet('holdem.token', null);
  }
  show();
});
sock.on('disconnect', () => { connected = false; show(); });
sock.on('connect_error', () => { connected = false; show(); });
sock.on('kicked', () => { lsSet('holdem.token', null); toast('다른 기기에서 같은 닉네임으로 들어와서 이 화면은 로그아웃됐어요.'); });
sock.on('state', v => {
  if (resuming && !v.me && V && V.me) return; // keep the last table on screen while the session resumes
  V = v; recvAt = Date.now(); show();
});

function show(){
  $('conn').hidden = connected;
  const inGame = !!(V && V.me);
  $('login').hidden = inGame || resuming;
  $('game').hidden = !inGame;
  if (inGame) {
    render();
    const h = V.hand, turnKey = h && h.opts ? `${h.no}-${h.street}-${h.toAct}-${h.opts.currentBet}` : '';
    if (turnKey && turnKey !== lastTurn) { try { navigator.vibrate && navigator.vibrate(80); } catch {} }
    lastTurn = turnKey;
  } else if (!$('login').hidden && !$('liName').value) $('liName').value = lsGet('holdem.name') || '';
}

/* ---------- login ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('liName').value.trim(), pin = $('liPin').value;
  $('liErr').textContent = ''; $('liBtn').disabled = true;
  const r = await call('login', { name, pin });
  $('liBtn').disabled = false;
  if (!r.ok) { $('liErr').textContent = r.msg || '입장하지 못했어요.'; return; }
  lsSet('holdem.token', r.token); lsSet('holdem.name', r.name);
  $('liPin').value = ''; show();
  toast(r.isNew ? `환영해요! 시작 칩 ${fmt(r.chips)}` : `다시 왔네요. 저장된 칩 ${fmt(r.chips)}`);
});

/* ---------- rendering ---------- */
function cardHTML(c, o = {}){
  if (o.back) return '<div class="card back"></div>';
  if (!c) return '<div class="card slot"></div>';
  const red = c[1] === 'h' || c[1] === 'd', r = c[0] === 'T' ? '10' : c[0];
  return `<div class="card${red?' red':''}${o.dim?' dim':''}${o.hi?' hi':''}" aria-label="${r}${SUIT[c[1]]}"><span class="r">${r}</span><span class="s">${SUIT[c[1]]}</span></div>`;
}
function winSet(){
  const h = V.hand; if (!h || !h.over || !h.result || h.result.reason !== 'show') return null;
  const s = new Set(); Object.values(h.result.best || {}).forEach(cs => cs.forEach(c => s.add(c))); return s;
}
function seatHTML(i, base){
  const k = (i - base + 5) % 5, sd = V.seats[i], h = V.hand;
  if (!sd) {
    const can = V.me.seat == null;
    return `<div class="seat p${k}"><button type="button" class="empty" data-sit="${i}" ${can?'':'disabled'}>${can?'앉기':'빈 자리'}</button></div>`;
  }
  const hz = h && h.ps[i] && h.ps[i].current ? h.ps[i] : null;
  const active = h && !h.over, res = h && h.over ? h.result : null, won = res && res.wins && res.wins[i];
  const cls = ['seat', 'p' + k];
  if (active && h.toAct === i) cls.push('turn');
  if (hz && hz.folded) cls.push('folded');
  if (active && !hz) cls.push('out');
  if (sd.away) cls.push('away');
  if (won) cls.push('winner');
  let mini = '';
  if (hz && !sd.me) {
    if (hz.cards) { const ws = winSet(); mini = `<div class="mini show">${hz.cards.map(c => cardHTML(c, { hi: ws && ws.has(c), dim: ws && !ws.has(c) })).join('')}</div>`; }
    else if (!hz.folded) mini = `<div class="mini">${cardHTML(null,{back:1})}${cardHTML(null,{back:1})}</div>`;
  }
  let st = '<div class="st muted"></div>';
  if (won) st = `<div class="st win">+${fmt(won)}${res.shown[i] ? ' · ' + esc(res.shown[i]) : ''}</div>`;
  else if (res && res.shown && res.shown[i]) st = `<div class="st hand">${esc(res.shown[i])}</div>`;
  else if (hz && hz.folded) st = '<div class="st muted">폴드</div>';
  else if (hz && hz.allin) st = `<div class="st">${hz.bet ? `<i class="chip"></i>${fmt(hz.bet)} ` : ''}올인</div>`;
  else if (hz && hz.bet > 0) st = `<div class="st"><i class="chip"></i>${fmt(hz.bet)}</div>`;
  else if (active && h.toAct === i) st = sd.me ? '<div class="st">내 차례</div>' : '<div class="st muted">생각 중</div>';
  else if (sd.away) st = '<div class="st muted">자리비움</div>';
  else if (sd.chips === 0) st = '<div class="st muted">파산</div>';
  else if (active && !hz) st = '<div class="st muted">다음 핸드부터</div>';
  const dealer = (h ? h.button : V.button) === i;
  return `<div class="${cls.join(' ')}">${mini}<div class="plate"><div class="nm"><i class="dot${sd.online?' on':''}"></i><span class="t">${esc(sd.name)}${sd.me?' (나)':''}</span>${dealer?'<span class="dbtn">D</span>':''}</div><div class="ch">${fmt(sd.chips)}</div></div>${st}</div>`;
}
function myHole(){ const h = V.hand, s = V.me.seat; return h && s != null && h.ps[s] && h.ps[s].current ? h.ps[s] : null; }
function render(){
  const me = V.me, h = V.hand;
  $('meta').textContent = `블라인드 ${fmt(h ? h.sb : V.cfg.sb)}/${fmt(h ? h.bb : V.cfg.bb)} · 핸드 #${V.handNo}`;
  const base = me.seat != null ? me.seat : 0;
  $('seats').innerHTML = SI.map(i => seatHTML(i, base)).join('');
  const ws = winSet();
  $('pot').innerHTML = h ? `<small>팟</small>${fmt(h.over && h.result ? h.result.pot : h.pot)}` : '';
  $('board').innerHTML = SI.map(k => { const c = h && h.board[k]; return cardHTML(c, { hi: ws && c && ws.has(c), dim: ws && c && !ws.has(c) }); }).join('');
  $('street').textContent = !h ? (V.seats.filter(Boolean).length < 2 ? '2명 이상 앉으면 시작해요' : '곧 시작해요') : h.over ? (h.result.reason === 'fold' ? '폴드로 종료' : '쇼다운') : STREETS[h.street];
  $('ticker').innerHTML = (h ? h.log.slice(-2) : []).map(t => `<span>${esc(t)}</span>`).join(' · ');
  renderMine(); renderBar();
  if (!$('rankSheet').hidden) renderRank();
  if (!$('menuSheet').hidden) renderMenu();
}
function renderMine(){
  const me = V.me, h = V.hand, hz = myHole(), ws = winSet();
  const cards = hz && hz.cards ? hz.cards.map(c => cardHTML(c, { hi: ws && ws.has(c), dim: (ws && !ws.has(c)) || (hz.folded && !h.over) })).join('') : cardHTML(null) + cardHTML(null);
  let made = me.seat == null ? '관전 중 · 빈 자리를 눌러 앉으세요' : '이번 핸드 대기';
  if (hz && hz.cards) {
    if (hz.folded) made = '폴드했어요';
    else if (h.board.length >= 3 && h.myBest) made = h.myBest;
    else made = hz.cards[0][0] === hz.cards[1][0] ? '포켓 페어' : (hz.cards[0][1] === hz.cards[1][1] ? '수딧' : '내 패');
  }
  const net = me.chips - me.invested;
  $('mine').innerHTML = `<div class="cards">${cards}</div><div class="info"><div class="made">${esc(made)}</div>
    <div class="sub">칩 ${fmt(me.chips)} · 손익 <span class="${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}</span></div>
    <div class="seatBtns">${me.seat != null ? `<button type="button" data-seat="away">${me.away?'복귀하기':'자리비움'}</button><button type="button" data-seat="stand">일어나기</button>` : ''}</div></div>`;
}
function renderBar(){
  const me = V.me, h = V.hand, bar = $('bar');
  const o = h && h.opts;
  const sig = JSON.stringify([h && h.no, h && h.street, h && h.toAct, h && h.over, o, me.seat, me.canRecover, me.chips === 0, me.away, V.nextIn > 0, h && h.result && h.result.pot]);
  if (sig === ui.barSig) return; ui.barSig = sig;
  let html = '';
  if (me.canRecover) {
    html += `<div class="recover"><b>파산했어요</b><span>시작 칩의 ${V.cfg.recoverPct}%인 <b style="display:inline;font-size:inherit">${fmt(me.recoverAmt)}</b> 칩을 받고 다시 시작할 수 있어요.</span><button type="button" class="wide" data-act="recover">칩 ${fmt(me.recoverAmt)} 복구하고 계속하기</button></div>`;
  }
  if (h && !h.over) {
    if (o) {
      const key = `${h.no}-${h.street}-${o.currentBet}`;
      if (ui.raiseKey !== key) { ui.raiseKey = key; ui.raiseTo = o.minTo; }
      ui.raiseTo = Math.max(o.minTo, Math.min(o.maxTo, ui.raiseTo));
      const slider = o.canRaise && o.minTo < o.maxTo;
      const callLbl = o.toCall === 0 ? '체크' : (o.toCall >= me.chips ? `콜 ${fmt(o.toCall)} 올인` : `콜 ${fmt(o.toCall)}`);
      html += `${slider ? `<div class="presets"><button type="button" data-preset="min">최소</button><button type="button" data-preset="half">½ 팟</button><button type="button" data-preset="pot">팟</button><button type="button" data-preset="all">올인</button></div>
        <div class="raiseRow"><input type="range" id="raiseRange" min="${o.minTo}" max="${o.maxTo}" step="1" value="${ui.raiseTo}" aria-label="베팅 금액"><span class="amt" id="raiseAmt">${fmt(ui.raiseTo)}</span></div>` : ''}
        <div class="acts"><button type="button" class="fold" data-act="fold">폴드</button><button type="button" class="call" data-act="call">${callLbl}</button>
        <button type="button" class="raise" id="raiseBtn" data-act="raise" ${o.canRaise?'':'disabled'}>${raiseLabel(o)}</button></div>`;
    } else {
      const who = h.toAct >= 0 && V.seats[h.toAct] ? V.seats[h.toAct].name : '';
      html += `<div class="wait"><span>${esc(who)} 차례 <span class="tm" id="turnTimer"></span></span></div>`;
    }
  } else {
    if (h && h.over && h.result) {
      const ent = Object.entries(h.result.wins);
      const head = ent.map(([i, a]) => `${esc(V.seats[i] ? V.seats[i].name : h.ps[i].name)} +${fmt(a)}`).join(' · ');
      const sub = h.result.reason === 'fold' ? '나머지 모두 폴드' : [...new Set(ent.map(([i]) => h.result.shown[i]))].join(' · ');
      html += `<div class="result"><b>${head}</b>${esc(sub)} <span id="nextTimer"></span></div>`;
    } else if (!me.canRecover) {
      const n = V.seats.filter(Boolean).length;
      html += `<div class="result">${n} / 5 명 착석${n < 2 ? ' · 친구를 기다리는 중' : ''}</div>`;
    }
  }
  bar.innerHTML = html;
  tick();
}
function raiseLabel(o){ return ui.raiseTo >= o.maxTo ? `올인 ${fmt(o.maxTo)}` : `${o.currentBet === 0 ? '벳' : '레이즈'} ${fmt(ui.raiseTo)}`; }
function setRaise(v){
  const o = V.hand && V.hand.opts; if (!o) return;
  ui.raiseTo = Math.max(o.minTo, Math.min(o.maxTo, Math.round(v)));
  const r = $('raiseRange'); if (r) r.value = ui.raiseTo;
  $('raiseAmt').textContent = fmt(ui.raiseTo); $('raiseBtn').textContent = raiseLabel(o);
}
function tick(){
  if (!V || !V.hand) return;
  const el = Date.now() - recvAt;
  const t = $('turnTimer'); if (t && !V.hand.over) t.textContent = `${Math.max(0, Math.ceil((V.hand.turnLeft - el) / 1000))}초`;
  const n = $('nextTimer'); if (n) { const left = V.nextIn - el; n.textContent = left > 0 ? `· ${Math.ceil(left / 1000)}초 뒤 다음 핸드` : ''; }
}
setInterval(tick, 500);

function renderRank(){
  const rows = (V.ranking || []).map((r, i) => {
    const me = V.me && r.name === V.me.name;
    const medal = i < 3 ? `<span class="medal">${i + 1}</span>` : i + 1;
    return `<tr class="${me?'me':''}"><td>${medal}</td><td>${esc(r.name)}${r.online?' <i class="dot on" style="display:inline-block"></i>':''}</td><td>${fmt(r.chips)}</td><td class="${r.net>0?'pos':r.net<0?'neg':''}">${r.net>0?'+':''}${fmt(r.net)}</td><td>${r.handsWon}/${r.handsPlayed}</td><td>${r.busts}</td></tr>`;
  }).join('');
  $('rankTable').innerHTML = `<thead><tr><th></th><th>이름</th><th>칩</th><th>손익</th><th>승/판</th><th>파산</th></tr></thead><tbody>${rows || '<tr><td colspan="6" style="font-family:var(--f-body);color:var(--muted)">아직 아무도 없어요.</td></tr>'}</tbody>`;
}
function renderMenu(){
  const c = V.cfg;
  $('menuInfo').innerHTML = `<b>${esc(V.me.name)}</b>${V.me.isAdmin ? ' (방장)' : ''} · 파산 ${V.me.busts}회 · 복구 ${V.me.recovers}회<br>시작 칩 ${fmt(c.start)} · 블라인드 ${fmt(c.sb)}/${fmt(c.bb)} · 파산 복구 ${c.recoverPct}% · 차례 ${c.turnSecs}초${V.owner ? `<br>방장: ${esc(V.owner)}` : ''}`;
  $('adminOpen').hidden = !(V.me.isAdmin || V.adminKeyEnabled);
}

/* ---------- events ---------- */
document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) $(c.dataset.close).hidden = true; });
$('rankBtn').addEventListener('click', () => { $('rankSheet').hidden = false; renderRank(); });
$('menuBtn').addEventListener('click', () => { $('menuSheet').hidden = false; renderMenu(); });
$('logoutBtn').addEventListener('click', async () => {
  await call('logout'); lsSet('holdem.token', null); $('menuSheet').hidden = true; show();
});
$('seats').addEventListener('click', async e => {
  const b = e.target.closest('[data-sit]'); if (!b || b.disabled) return;
  const r = await call('sit', { seat: +b.dataset.sit }); if (!r.ok && r.msg) toast(r.msg);
});
$('mine').addEventListener('click', async e => {
  const b = e.target.closest('[data-seat]'); if (!b) return;
  const r = await call(b.dataset.seat); if (!r.ok && r.msg) toast(r.msg);
});
$('bar').addEventListener('input', e => { if (e.target.id === 'raiseRange') setRaise(+e.target.value); });
$('bar').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const o = V.hand && V.hand.opts;
  if (t.dataset.preset && o) {
    const base = o.pot + o.toCall, cb = o.currentBet;
    setRaise({ min: o.minTo, half: cb + base / 2, pot: cb + base, all: o.maxTo }[t.dataset.preset]); return;
  }
  const a = t.dataset.act; if (!a) return;
  if (a === 'recover') { const r = await call('recover'); toast(r.ok ? `칩 ${fmt(r.amount)} 복구했어요.` : (r.msg || '복구하지 못했어요.')); return; }
  const btns = $('bar').querySelectorAll('button'); btns.forEach(x => x.disabled = true);
  const r = await call('act', { type: a, to: ui.raiseTo, no: V.hand && V.hand.no });
  if (!r.ok) { toast(r.msg || '처리하지 못했어요.'); ui.barSig = ''; if (V) render(); }
});

/* ---------- admin ---------- */
$('adminOpen').addEventListener('click', () => {
  $('menuSheet').hidden = true; $('adminSheet').hidden = false;
  const own = !!(V && V.me && V.me.isAdmin);
  $('adKeyWrap').hidden = own; $('adBody').hidden = true; $('adMsg').textContent = ''; $('adKey').value = adminKey;
  if (own || adminKey) adminCheck();
});
$('adKey').addEventListener('change', () => { adminKey = $('adKey').value.trim(); adminCheck(); });
async function adm(msg){ const r = await call('admin', { key: adminKey, ...msg }); $('adMsg').style.color = r.ok ? 'var(--good)' : 'var(--danger)'; $('adMsg').textContent = r.msg || (r.ok ? '완료' : '실패'); return r; }
async function adminCheck(){
  if (!(V && V.me && V.me.isAdmin)) { adminKey = $('adKey').value.trim(); if (!adminKey) return; }
  const r = await adm({ op: 'check' });
  $('adBody').hidden = !r.ok; if (!r.ok) return;
  $('adMsg').textContent = '';
  $('adOwner').textContent = `현재 방장: ${r.owner || '없음'} · 설정은 다음 핸드부터 적용돼요.`;
  const c = r.cfg; $('cfgStart').value = c.start; $('cfgSb').value = c.sb; $('cfgBb').value = c.bb; $('cfgRec').value = c.recoverPct; $('cfgTurn').value = c.turnSecs;
  $('tgList').innerHTML = r.names.map(n => `<option value="${esc(n)}">`).join('');
}
$('cfgSave').addEventListener('click', () => adm({ op: 'cfg', start: $('cfgStart').value, sb: $('cfgSb').value, bb: $('cfgBb').value, recoverPct: $('cfgRec').value, turnSecs: $('cfgTurn').value }));
$('tgSetChips').addEventListener('click', () => adm({ op: 'setChips', name: $('tgName').value, chips: $('tgChips').value, alsoInvested: false }));
$('tgSetPin').addEventListener('click', async () => { const r = await adm({ op: 'resetPin', name: $('tgName').value, pin: $('tgPin').value }); if (r.ok) $('tgPin').value = ''; });
$('tgSetAdmin').addEventListener('click', async () => {
  const b = $('tgSetAdmin');
  if (Date.now() - ui.resetArm > 4000 || ui.armFor !== 'admin') { ui.resetArm = Date.now(); ui.armFor = 'admin'; b.textContent = '한 번 더 누르면 방장 넘기기'; setTimeout(() => b.textContent = '이 사람에게 방장 넘기기', 4000); return; }
  ui.resetArm = 0; b.textContent = '이 사람에게 방장 넘기기';
  const r = await adm({ op: 'setAdmin', name: $('tgName').value });
  if (r.ok) adminCheck();
});
$('tgDelete').addEventListener('click', async () => {
  const b = $('tgDelete');
  if (Date.now() - ui.resetArm > 4000 || ui.armFor !== 'del') { ui.resetArm = Date.now(); ui.armFor = 'del'; b.textContent = '한 번 더 누르면 삭제'; setTimeout(() => b.textContent = '이 계정 삭제', 4000); return; }
  ui.resetArm = 0; b.textContent = '이 계정 삭제'; await adm({ op: 'delete', name: $('tgName').value }); adminCheck();
});
$('resetAll').addEventListener('click', async () => {
  const b = $('resetAll');
  if (Date.now() - ui.resetArm > 4000 || ui.armFor !== 'all') { ui.resetArm = Date.now(); ui.armFor = 'all'; b.textContent = '한 번 더 누르면 모두 초기화'; setTimeout(() => b.textContent = '전체 칩 초기화', 4000); return; }
  ui.resetArm = 0; b.textContent = '전체 칩 초기화'; await adm({ op: 'resetAll' });
});

show();
</script>
</body>
</html>
